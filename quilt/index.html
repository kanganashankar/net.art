<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpongeBob Quilt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="quilt">

    <!-- Top row -->
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Eye row -->
    <div class="sq yellow"></div>
    <div class="sq white"></div>
    <div class="sq blue"></div>
    <div class="sq white"></div>
    <div class="sq yellow"></div>

    <!-- Middle face -->
    <div class="sq yellow"></div>
    <div class="sq cheek"></div>
    <div class="sq nose"></div>
    <div class="sq cheek"></div>
    <div class="sq yellow"></div>

    <!-- Mouth row -->
    <div class="sq yellow"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq yellow"></div>

    <!-- Teeth row -->
    <div class="sq yellow"></div>
    <div class="sq tooth"></div>
    <div class="sq tooth"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Sponge holes row -->
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>

</div>

</body>
</html>
