<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpongeBob Quilt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="quilt">

    <!-- 10 columns × 10 rows = 100 quilt squares -->
    <!-- You can adjust colors to form SpongeBob’s face -->

    <!-- Row 1 -->
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Row 2 -->
    <div class="sq yellow"></div>
    <div class="sq white"></div>
    <div class="sq blue"></div>
    <div class="sq white"></div>
    <div class="sq yellow"></div>
    <div class="sq white"></div>
    <div class="sq blue"></div>
    <div class="sq white"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Row 3 -->
    <div class="sq yellow"></div>
    <div class="sq cheek"></div>
    <div class="sq yellow"></div>
    <div class="sq nose"></div>
    <div class="sq yellow"></div>
    <div class="sq cheek"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Row 4 -->
    <div class="sq yellow"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq mouth"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Row 5 -->
    <div class="sq yellow"></div>
    <div class="sq tooth"></div>
    <div class="sq tooth"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq tooth"></div>
    <div class="sq tooth"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>
    <div class="sq yellow"></div>

    <!-- Rows 6–10: sponge holes + filler -->
    <!-- You can customize these however you want -->
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>
    <div class="sq yellow"></div>
    <div class="sq hole"></div>
    <div class="sq yellow"></div>

    <!-- Fill remaining rows with yellow or holes -->
    <!-- (You can duplicate the pattern above) -->

</div>

</body>
</html>
