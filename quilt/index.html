<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Patchwork Quilt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="quilt">

    <div class="block fuchsia inner-square"></div>
    <div class="block lavender circle border-mint"></div>
    <div class="block aqua"></div>
    <div class="block mint inner-square border-sky"></div>
    <div class="block sky circle"></div>
    <div class="block butter"></div>

    <div class="block lavender"></div>
    <div class="block mint circle"></div>
    <div class="block fuchsia border-aqua"></div>
    <div class="block butter inner-square"></div>
    <div class="block aqua circle"></div>
    <div class="block sky"></div>

    <div class="block mint"></div>
    <div class="block butter circle border-fuchsia"></div>
    <div class="block lavender inner-square"></div>
    <div class="block fuchsia"></div>
    <div class="block sky border-lavender"></div>
    <div class="block aqua"></div>

    <div class="block sky inner-square"></div>
    <div class="block fuchsia circle"></div>
    <div class="block mint"></div>
    <div class="block lavender border-butter"></div>
    <div class="block butter"></div>
    <div class="block aqua circle"></div>

    <div class="block butter"></div>
    <div class="block sky circle border-mint"></div>
    <div class="block lavender"></div>
    <div class="block mint inner-square"></div>
    <div class="block fuchsia"></div>
    <div class="block aqua"></div>

    <div class="block aqua circle"></div>
    <div class="block butter"></div>
    <div class="block sky"></div>
    <div class="block lavender inner-square border-fuchsia"></div>
    <div class="block mint"></div>
    <div class="block fuchsia circle"></div>

</div>

</body>
</html>
