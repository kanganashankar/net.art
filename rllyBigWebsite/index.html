<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lost Keys</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="page-wrapper">
    <h1 class="title">The Case of the Missing Keys</h1>

    
    <div id="keyboard-area">
      <img src="img/keyboard.jpg" alt="Blank keyboard" id="keyboard-image">
      <p class="keyboard-text">
        This keyboard is missing its keys... scroll around to find them.
      </p>
    </div>

    
    <div class="key key-a">
      <span class="key-label">A</span>
      <span class="key-message">Yay, you found key A!</span>
    </div>

    <div class="key key-enter">
      <span class="key-label">Enter</span>
      <span class="key-message">Nice! The Enter key was hiding here.</span>
    </div>

    <div class="key key-space">
      <span class="key-label">Space</span>
      <span class="key-message">You discovered the Space bar!</span>
    </div>

    <div class="key key-z">
      <span class="key-label">Z</span>
      <span class="key-message">Key Z unlocked. Keep exploring.</span>
    </div>

    <div class="secret-note">
      <span class="secret-span">Secret:</span> You made it all the way down here.
    </div>
  </div>
</body>
</html>
