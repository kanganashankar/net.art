<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Night at the Museum</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <h1>Night at the Museum</h1>
  <p class="subtitle">Please do not touch the exhibits.</p>

  <button id="switch">Turn off the lights</button>

  <div class="gallery">

    <div class="exhibit">
      <div class="art">🗿</div>
      <p class="day-text">Stone Head, c. 1200</p>
      <p class="night-text">my face is SO tired</p>
    </div>

    <div class="exhibit">
      <div class="art">🏺</div>
      <p class="day-text">Greek Vase, 450 BCE</p>
      <p class="night-text">i'm so thirsty</p>
    </div>

    <div class="exhibit">
      <div class="art">🦖</div>
      <p class="day-text">Dinosaur, 66 million BCE</p>
      <p class="night-text">RAWR (finally)</p>
    </div>

    <div class="exhibit">
      <div class="art">🖼️</div>
      <p class="day-text">Landscape, oil on canvas</p>
      <p class="night-text">wheee!!</p>
    </div>

    <div class="exhibit">
      <div class="art">🛡️</div>
      <p class="day-text">Knight's Shield, 1400s</p>
      <p class="night-text">who's there?!</p>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
